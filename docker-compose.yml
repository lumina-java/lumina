version: "3.9"

services:
  lumina-clean:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lumina-clean-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./.env:/app/.env
      - ./storage:/app/storage
      - ./database:/app/database
      - ./public:/app/public
    environment:
      - APP_ENV=production
      - APP_PORT=8000
    networks:
      - lumina-net

networks:
  lumina-net:
    driver: bridge
